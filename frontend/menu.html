<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu · Campus Café</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">☕</span><span class="brand-name">Campus Café</span></a>
      <nav class="nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="menu.html" aria-current="page">Menu</a>
        <a href="order.html" class="nav-cart">Order <span id="cart-count" class="badge" hidden>0</span></a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="page-head">
      <h1>Menu</h1>
      <p>Tap <strong>Add</strong> on anything you like. Review and place your order on the next page.</p>
    </section>

    <div id="tabs" class="tabs" role="tablist" aria-label="Menu categories"></div>
    <ul id="menu-grid" class="menu-grid" role="tabpanel"></ul>

    <div id="sticky-cta" class="sticky-cta" hidden>
      <a class="btn btn-primary" href="order.html" id="cta-link">Review order</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>☕ Campus Café</span>
      <span>Mon–Fri 7 AM–7 PM · Pickup only · Pay at the counter</span>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="menu.js"></script>
  <script src="cart.js"></script>
  <script src="menu-page.js"></script>
</body>
</html>
